version: 2

multi-ecosystem-groups:
  app:
    schedule:
      interval: "weekly"
  infra:
    schedule:
      interval: "weekly"
  tooling:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "app"
    # TypeScript 7.0 is the Go compiler rewrite and ships no programmatic
    # compiler API, so typescript-eslint and ts-jest cannot consume it and both
    # fail hard on a 7.0 bump.
    #
    # Scoped to 7.0.x rather than all majors on purpose. 6.0.3 is the last 6.x
    # that will ever be published, so ignoring every major would pin TypeScript
    # here permanently with nothing left to surface the decision again. This
    # way, when 7.1 ships the promised API, Dependabot proposes it on its own
    # and CI reports whether typescript-eslint and ts-jest support it yet.
    ignore:
      - dependency-name: "typescript"
        versions: ["7.0.x"]

  - package-ecosystem: "uv"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "tooling"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "tooling"

  - package-ecosystem: "docker"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"

  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"

  - package-ecosystem: "terraform"
    directory: "/_infra"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"

  - package-ecosystem: "terraform"
    directory: "/_infra_state_mgmt"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"
