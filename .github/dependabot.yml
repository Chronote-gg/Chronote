version: 2

# One weekly PR across application, desktop, tooling and infrastructure.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    # TypeScript 7.0 is the Go compiler rewrite and ships no programmatic
    # compiler API, so typescript-eslint and ts-jest cannot consume it and both
    # fail hard on a 7.0 bump.
    #
    # Scoped to 7.0.x rather than all majors on purpose. 6.0.3 is the last 6.x
    # that will ever be published, so ignoring every major would pin TypeScript
    # here permanently with nothing left to surface the decision again. This
    # way, when 7.1 ships the promised API, Dependabot proposes it on its own
    # and CI reports whether typescript-eslint and ts-jest support it yet.
    ignore:
      - dependency-name: "typescript"
        versions: ["7.0.x"]

      # Langfuse 6.x requires the OpenTelemetry 2.x / 0.223 stack.
      - dependency-name: "@opentelemetry/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/sdk-node"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">=0.300.0"]

  - package-ecosystem: "uv"
    directory: "/"
    # 1.24.3 crashes parsing existing TypeScript; reconsider when fixed upstream.
    ignore:
      - dependency-name: "lizard"
        versions: ["1.24.3"]
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    # The application and shared quality tool target Node 24.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directory: "/_infra"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directory: "/_infra_state_mgmt"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "typescript"
        versions: ["7.0.x"]

  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
