version: 2

multi-ecosystem-groups:
  app:
    schedule:
      interval: "weekly"
  infra:
    schedule:
      interval: "weekly"
  tooling:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "app"
    # TypeScript 7 is the Go compiler rewrite. It ships no programmatic
    # compiler API until 7.1, so typescript-eslint and ts-jest cannot consume
    # it and both fail hard on a 7.x bump. Hold at 6.x so the app group stays
    # mergeable, and treat the 7.x move as a deliberate migration.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "tooling"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "tooling"

  - package-ecosystem: "docker"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"

  - package-ecosystem: "docker-compose"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"

  - package-ecosystem: "terraform"
    directory: "/_infra"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"

  - package-ecosystem: "terraform"
    directory: "/_infra_state_mgmt"
    patterns:
      - "*"
    multi-ecosystem-group: "infra"
