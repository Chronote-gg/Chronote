name: Terraform Plan

run-name: Terraform Plan ${{ inputs.github_environment }}/${{ inputs.terraform_workspace }}/${{ inputs.plan_scope }}

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub environment containing Terraform plan credentials and tfvars
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - production
      terraform_workspace:
        description: Terraform workspace to plan against; production uses default, sandbox uses sandbox
        required: true
        type: string
        default: sandbox
      plan_scope:
        description: Full infrastructure or a fixed permission/deployment prerequisite scope
        required: true
        type: choice
        default: full
        options:
          - full
          - purchase-permission
          - meeting-update-delivery
          - deployment-prerequisites

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ inputs.github_environment }}-${{ inputs.terraform_workspace }}
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ inputs.github_environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: yarn
      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh
      - name: Configure production AWS credentials
        if: ${{ inputs.github_environment == 'production' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure Sandbox AWS credentials
        if: ${{ inputs.github_environment == 'sandbox' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_AWS_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["dynamodb:Describe*","dynamodb:ListTagsOfResource","iam:Get*","iam:List*","kms:Describe*","kms:Get*","kms:List*","s3:ListBucket","s3:GetBucket*","s3:GetEncryptionConfiguration","s3:GetLifecycleConfiguration"],"Resource":"*"},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"arn:aws:s3:::*/meeting-notes-terraform/sandbox/meeting-notes-terraform/state"},{"Effect":"Allow","Action":["dynamodb:GetItem","dynamodb:PutItem","dynamodb:DeleteItem"],"Resource":"arn:aws:dynamodb:us-east-1:*:table/*"},{"Effect":"Allow","Action":["s3:PutObject","s3:GetObjectVersion"],"Resource":"arn:aws:s3:::*/terraform/sandbox/*"},{"Effect":"Allow","Action":["kms:GenerateDataKey","kms:Decrypt"],"Resource":"arn:aws:kms:us-east-1:*:key/*"}]}'
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Run private Terraform Plan
        env:
          GH_TOKEN: ${{ github.token }}
          TERRAFORM_PRIVATE_STORAGE_JSON: ${{ secrets.TERRAFORM_PRIVATE_STORAGE_JSON }}
          TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
          REDIS_AUTH_TOKEN: ${{ secrets.REDIS_AUTH_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set +x
          node scripts/deployment/terraform-dispatch.cjs
