name: Terraform Plan

run-name: Terraform Plan ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding the Terraform role, tfvars and plan passphrase
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKSPACE: ${{ inputs.environment == 'production' && 'default' || 'sandbox' }}
      TF_LOG: ""
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Require master
        run: test "$GITHUB_REF" = refs/heads/master

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_AWS_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Write tfvars
        env:
          TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
          REDIS_AUTH_TOKEN: ${{ secrets.REDIS_AUTH_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_VARS_JSON: ${{ toJSON(vars) }}
        run: python3 scripts/deployment/terraform-tfvars.py

      # Terraform output can carry values, so it goes only to a log file that
      # is uploaded encrypted; on failure the job prints the exit code alone.
      - name: Plan
        id: plan
        run: |
          set +x
          unset TF_LOG TF_LOG_CORE TF_LOG_PROVIDER TF_LOG_PATH
          log="$RUNNER_TEMP/terraform.log"
          fail() { echo "::error::terraform $1 failed with exit code $2; read the encrypted terraform log artifact"; exit 1; }
          terraform -chdir=_infra init -input=false -lockfile=readonly >> "$log" 2>&1 || fail init $?
          status=0
          terraform -chdir=_infra plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan >> "$log" 2>&1 || status=$?
          case "$status" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) fail plan "$status" ;;
          esac

      # The saved plan holds every variable value, including credentials, so
      # only the encrypted bundle leaves the runner. The Lambda archives are
      # data-source outputs the apply reads from disk, so they travel with it.
      - name: Encrypt plan
        id: bundle
        if: steps.plan.outputs.changes == 'true'
        env:
          TERRAFORM_PLAN_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_PASSPHRASE }}
        run: |
          test -n "$TERRAFORM_PLAN_PASSPHRASE"
          cd _infra
          tar -czf "$RUNNER_TEMP/plan.tgz" tfplan $(ls *.zip 2>/dev/null)
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:TERRAFORM_PLAN_PASSPHRASE -in "$RUNNER_TEMP/plan.tgz" -out "$RUNNER_TEMP/plan.tgz.enc"
          rm "$RUNNER_TEMP/plan.tgz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/plan.tgz.enc" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Only types, addresses and actions reach the summary; values never do.
      - name: Summarize changes
        env:
          PLAN_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set +x
          log="$RUNNER_TEMP/terraform.log"
          terraform -chdir=_infra show -json tfplan > "$RUNNER_TEMP/plan.json" 2>> "$log" || { echo "::error::terraform show failed with exit code $?"; exit 1; }
          node scripts/deployment/terraform-runs.cjs plan-summary "$RUNNER_TEMP/plan.json" "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" "$PLAN_SHA256" >> "$GITHUB_STEP_SUMMARY"
          rm "$RUNNER_TEMP/plan.json"

      - name: Upload encrypted plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ runner.temp }}/plan.tgz.enc
          retention-days: 1
          if-no-files-found: error

      - name: Encrypt log
        if: always()
        env:
          TERRAFORM_PLAN_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_PASSPHRASE }}
        run: |
          log="$RUNNER_TEMP/terraform.log"
          if [ -f "$log" ] && [ -n "$TERRAFORM_PLAN_PASSPHRASE" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:TERRAFORM_PLAN_PASSPHRASE -in "$log" -out "$log.enc"
          fi
          rm -f "$log"

      - name: Upload encrypted log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-log-${{ inputs.environment }}
          path: ${{ runner.temp }}/terraform.log.enc
          retention-days: 1
          if-no-files-found: ignore

      - name: Remove plaintext plan
        if: always()
        run: rm -f _infra/tfplan _infra/terraform.auto.tfvars.json "$RUNNER_TEMP/plan.tgz" "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/terraform.log"
