name: Terraform Plan

run-name: Terraform Plan ${{ inputs.github_environment }}/${{ inputs.terraform_workspace }}/${{ inputs.plan_scope }}

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub environment containing Terraform plan credentials and tfvars
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - production
      terraform_workspace:
        description: Terraform workspace to plan against; production uses default, sandbox uses sandbox
        required: true
        type: string
        default: sandbox
      plan_scope:
        description: Full infrastructure or a fixed permission/deployment prerequisite scope
        required: true
        type: choice
        default: full
        options:
          - full
          - purchase-permission
          - deployment-prerequisites
          - deployment-prerequisites

permissions:
  actions: read
  contents: read

concurrency:
  group: terraform-plan-${{ inputs.github_environment }}-${{ inputs.terraform_workspace }}
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ inputs.github_environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: yarn
      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Run private Terraform Plan
        env:
          GH_TOKEN: ${{ github.token }}
          TERRAFORM_PRIVATE_STORAGE_JSON: ${{ secrets.TERRAFORM_PRIVATE_STORAGE_JSON }}
          TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
          REDIS_AUTH_TOKEN: ${{ secrets.REDIS_AUTH_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set +x
          node scripts/deployment/terraform-dispatch.cjs
