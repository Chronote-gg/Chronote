name: Terraform Apply

run-name: Terraform Apply ${{ inputs.environment }} plan=${{ inputs.plan_run_id }} sha256=${{ inputs.plan_sha256 }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment the reviewed plan ran in
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - production
      plan_run_id:
        description: Run ID of the reviewed Terraform Plan, made from this same master commit
        required: true
        type: string
      plan_sha256:
        description: Plan bundle SHA-256 from the reviewed plan's summary
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  # Own group: a merge-triggered deploy must never displace a queued Apply.
  group: chronote-terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # production-terraform is made by hand, never by Terraform, with the owner
    # as its only reviewer, so a plan can never weaken the gate. It is the only
    # environment the production Apply role trusts. Sandbox applies in sandbox.
    environment: ${{ inputs.environment == 'production' && 'production-terraform' || 'sandbox' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKSPACE: ${{ inputs.environment == 'production' && 'default' || 'sandbox' }}
      TF_LOG: ""
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GH_TOKEN: ${{ github.token }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      ENVIRONMENT: ${{ inputs.environment }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
    steps:
      - name: Require master
        run: test "$GITHUB_REF" = refs/heads/master

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify the plan run is a successful plan of this commit
        run: node scripts/deployment/terraform-runs.cjs verify-plan-run "$ENVIRONMENT" "$PLAN_RUN_ID"

      - name: Refuse while a production deploy is open
        if: inputs.environment == 'production'
        run: node scripts/deployment/terraform-runs.cjs assert-production-idle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_AWS_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 7200
          unset-current-credentials: true
          mask-aws-account-id: true

      - name: Locate the plan
        id: store
        run: node scripts/deployment/terraform-runs.cjs plan-store "$ENVIRONMENT" "$PLAN_RUN_ID" 1 >> "$GITHUB_OUTPUT"

      # The approval binds this digest; nothing is unpacked unless the stored
      # bundle is exactly the one the reviewed summary named. HeadObject
      # reports a missing key as 404; only the code is printed, though the CLI
      # message names nothing but the operation and the error.
      # The bundle may only supply the saved plan and top-level Lambda
      # archives: names with a slash, `..` or anything else are refused before
      # extraction, so it can never write Terraform configuration, the lock
      # file or the provider cache.
      - name: Download and verify plan
        env:
          BUCKET: ${{ steps.store.outputs.bucket }}
          PREFIX: ${{ steps.store.outputs.prefix }}
        run: |
          set -o pipefail
          [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if ! err=$(aws s3api head-object --bucket "$BUCKET" --key "$PREFIX/plan.tar.gz" 2>&1 > /dev/null); then
            code=$(grep -oE '\([A-Za-z0-9]+\)' <<< "$err" | head -n 1 | tr -d '()' || true)
            if [ "$code" = 404 ]; then
              echo "::error::No stored plan for run $PLAN_RUN_ID: the plan had no changes or did not finish; there is nothing to apply"
            else
              echo "::error::Reading the stored plan failed (${code:-no error code}); check the Apply role's credentials and access"
            fi
            exit 1
          fi
          aws s3api get-object --bucket "$BUCKET" --key "$PREFIX/plan.tar.gz" "$RUNNER_TEMP/plan.tar.gz" > /dev/null
          echo "$PLAN_SHA256  $RUNNER_TEMP/plan.tar.gz" | sha256sum --check --quiet
          members=$(tar -tzf "$RUNNER_TEMP/plan.tar.gz")
          if grep -qvE '^(tfplan|[A-Za-z0-9_-]+\.zip)$' <<< "$members"; then
            echo "::error::The plan bundle holds a file other than the plan and its Lambda archives; refusing it"
            exit 1
          fi
          grep -qx tfplan <<< "$members" || { echo "::error::The bundle contains no saved plan"; exit 1; }
          tar -xzf "$RUNNER_TEMP/plan.tar.gz" -C _infra --no-same-owner $members

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      # A saved plan carries its own variables and refuses to apply against
      # state that changed since it was made, so there is no replan here.
      # Output goes only to the log stored beside the plan.
      - name: Apply the saved plan
        run: |
          set +x
          unset TF_LOG TF_LOG_CORE TF_LOG_PROVIDER TF_LOG_PATH
          log="$RUNNER_TEMP/terraform.log"
          fail() { echo "::error::terraform $1 failed with exit code $2; read the apply log in the plan store"; exit 1; }
          terraform -chdir=_infra init -input=false -lockfile=readonly >> "$log" 2>&1 || fail init $?
          terraform -chdir=_infra apply -input=false -lock-timeout=5m tfplan >> "$log" 2>&1 || fail apply $?

      - name: Store log
        if: always()
        env:
          BUCKET: ${{ steps.store.outputs.bucket }}
          PREFIX: ${{ steps.store.outputs.prefix }}
        run: |
          log="$RUNNER_TEMP/terraform.log"
          if [ -f "$log" ] && [ -n "$PREFIX" ]; then
            aws s3api put-object --bucket "$BUCKET" --key "$PREFIX/apply-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log" --body "$log" --if-none-match "*" > /dev/null || echo "::warning::Storing the apply log failed; the Apply result above stands"
          fi

      - name: Remove plaintext plan
        if: always()
        run: rm -rf _infra/tfplan "$RUNNER_TEMP/plan.tar.gz" "$RUNNER_TEMP/terraform.log"
