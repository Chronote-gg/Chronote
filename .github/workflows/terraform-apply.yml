name: Terraform Apply

run-name: Terraform Apply ${{ inputs.github_environment }}/${{ inputs.terraform_workspace }}/${{ inputs.plan_scope }} plan=${{ inputs.plan_run_id }} plan-sha=${{ inputs.plan_sha256 }} bundle-sha=${{ inputs.bundle_sha256 }}

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub environment containing Terraform apply credentials and tfvars
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - production
      terraform_workspace:
        description: Existing Terraform workspace from the reviewed plan; production uses default, sandbox uses sandbox
        required: true
        type: string
        default: sandbox
      plan_run_id:
        description: GitHub Actions run ID from the reviewed Terraform Plan workflow
        required: true
        type: string
      artifact_name:
        description: Logical bundle label from the reviewed plan summary, not a storage locator
        required: true
        type: string
      plan_sha256:
        description: SHA-256 from the reviewed Terraform Plan summary
        required: true
        type: string
      bundle_sha256:
        description: SHA-256 of the entire reviewed private bundle, including Lambda archives and provenance
        required: true
        type: string
      plan_scope:
        description: Scope of the reviewed saved plan
        required: true
        type: choice
        options:
          - full
          - purchase-permission
      confirmation:
        description: Type apply to request the reviewed plan; native approval is also required
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: terraform-apply-${{ inputs.github_environment }}-${{ inputs.terraform_workspace }}
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ inputs.github_environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: yarn
      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Run private Terraform Apply
        env:
          GH_TOKEN: ${{ github.token }}
          TERRAFORM_PRIVATE_STORAGE_JSON: ${{ secrets.TERRAFORM_PRIVATE_STORAGE_JSON }}
          TERRAFORM_PLAN_REFERENCE_JSON: ${{ secrets.TERRAFORM_PLAN_REFERENCE_JSON }}
          TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
          REDIS_AUTH_TOKEN: ${{ secrets.REDIS_AUTH_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set +x
          node scripts/deployment/terraform-dispatch.cjs
