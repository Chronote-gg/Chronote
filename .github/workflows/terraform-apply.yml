name: Terraform Apply

run-name: Terraform Apply ${{ inputs.environment }} plan=${{ inputs.plan_run_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment the reviewed plan ran in
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - production
      plan_run_id:
        description: Run ID of the reviewed Terraform Plan, made from this same master commit
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  # Own group: a merge-triggered deploy must never displace a queued Apply.
  group: chronote-terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The environment's required reviewer approves every Apply before it starts.
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKSPACE: ${{ inputs.environment == 'production' && 'default' || 'sandbox' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GH_TOKEN: ${{ github.token }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Require master
        run: test "$GITHUB_REF" = refs/heads/master

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify the plan run is a successful plan of this commit
        run: node scripts/deployment/terraform-runs.cjs verify-plan-run "$ENVIRONMENT" "$PLAN_RUN_ID"

      - name: Refuse while a production deploy is open
        if: inputs.environment == 'production'
        run: node scripts/deployment/terraform-runs.cjs assert-production-idle

      - name: Download encrypted plan
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan-${{ inputs.environment }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/plan

      - name: Decrypt plan
        env:
          TERRAFORM_PLAN_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_PASSPHRASE }}
        run: |
          echo "Encrypted plan SHA-256: $(sha256sum "$RUNNER_TEMP/plan/plan.tgz.enc" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:TERRAFORM_PLAN_PASSPHRASE -in "$RUNNER_TEMP/plan/plan.tgz.enc" | tar -xz -C _infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_AWS_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-apply-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      # A saved plan carries its own variables and refuses to apply against
      # state that changed since it was made, so there is no replan here.
      - name: Apply the saved plan
        run: |
          terraform -chdir=_infra init -input=false -lockfile=readonly
          terraform -chdir=_infra apply -input=false -lock-timeout=5m tfplan > /dev/null

      - name: Remove plaintext plan
        if: always()
        run: rm -rf _infra/tfplan "$RUNNER_TEMP/plan"
