name: Meeting Notes Bot Deploy

run-name: Meeting Notes Bot Deploy ${{ github.actor }}

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploybackend:
    name: Deploy Backend
    needs: [ci]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    env:
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      ECS_LOG_GROUP: ${{ vars.ECS_LOG_GROUP }}
      SECRETS_PREFIX: ${{ vars.SECRETS_PREFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Preflight Secrets Manager values
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          SECRETS_PREFIX="${SECRETS_PREFIX:-}"
          if [ -z "$SECRETS_PREFIX" ] && [ -n "${ECS_TASK_FAMILY:-}" ]; then
            SECRETS_PREFIX="${ECS_TASK_FAMILY%-bot-task}"
          fi
          if [ -z "$SECRETS_PREFIX" ]; then
            echo "ERROR: SECRETS_PREFIX is not set and could not be derived."
            exit 1
          fi

          SECRETS=(
            "${SECRETS_PREFIX}/discord-bot-token"
            "${SECRETS_PREFIX}/discord-client-secret"
            "${SECRETS_PREFIX}/oauth-secret"
            "${SECRETS_PREFIX}/openai-api-key"
            "${SECRETS_PREFIX}/langfuse-public-key"
            "${SECRETS_PREFIX}/langfuse-secret-key"
            "${SECRETS_PREFIX}/stripe-secret-key"
            "${SECRETS_PREFIX}/stripe-webhook-secret"
          )

          missing=()
          for secret in "${SECRETS[@]}"; do
            if ! versions=$(aws secretsmanager list-secret-version-ids --secret-id "$secret" --region "$AWS_REGION" 2>/dev/null); then
              missing+=("$secret (missing)")
              continue
            fi
            if ! echo "$versions" | jq -e '.Versions[]? | select(.VersionStages | index("AWSCURRENT"))' >/dev/null; then
              missing+=("$secret (no AWSCURRENT value)")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing or unset Secrets Manager values:"
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

          echo "Secrets Manager preflight passed."

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image tag already exists, skipping build and push."
            echo "image=$IMAGE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t "$IMAGE" .

          # Verify the image contains the required files
          echo "Verifying Docker image contents..."
          docker run --rm "$IMAGE" ls -la dist/index.js || {
            echo "ERROR: dist/index.js not found in Docker image!"
            exit 1
          }

          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Get current task definition
        id: current-task-def
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          CURRENT_TASK_DEF=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region $AWS_REGION | jq -r '.services[0].taskDefinition')
          echo "current_task_def=$CURRENT_TASK_DEF" >> $GITHUB_OUTPUT
          echo "Current task definition: $CURRENT_TASK_DEF"

      - name: Wait for active meetings to finish
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ACTIVE_MEETING_DEPLOY_WAIT_SECONDS: ${{ vars.ACTIVE_MEETING_DEPLOY_WAIT_SECONDS }}
        run: |
          set -euo pipefail

          secrets_prefix="${SECRETS_PREFIX:-}"
          if [ -z "$secrets_prefix" ] && [ -n "${ECS_TASK_FAMILY:-}" ]; then
            secrets_prefix="${ECS_TASK_FAMILY%-bot-task}"
          fi
          if [ -z "$secrets_prefix" ]; then
            echo "ERROR: SECRETS_PREFIX is not set and could not be derived."
            exit 1
          fi

          TABLE_NAME="${secrets_prefix}-ActiveMeetingTable"
          WAIT_TIMEOUT_SECONDS="${ACTIVE_MEETING_DEPLOY_WAIT_SECONDS:-7500}"
          POLL_SECONDS=30
          deadline=$(($(date +%s) + WAIT_TIMEOUT_SECONDS))

          while true; do
            # activeMeetingLeaseService stores leaseExpiresAt as epoch seconds.
            now_epoch_seconds=$(date +%s)
            active_count=0
            exclusive_start_key=""

            while true; do
              scan_args=(
                dynamodb scan
                --table-name "$TABLE_NAME"
                --region "$AWS_REGION"
                --consistent-read
                --filter-expression '#leaseExpiresAt >= :now AND (attribute_not_exists(#status) OR (#status <> :complete AND #status <> :cancelled))'
                --expression-attribute-names '{"#leaseExpiresAt":"leaseExpiresAt","#status":"status"}'
                --expression-attribute-values "{\":now\":{\"N\":\"$now_epoch_seconds\"},\":complete\":{\"S\":\"complete\"},\":cancelled\":{\"S\":\"cancelled\"}}"
                --select COUNT
                --output json
                --no-paginate
              )
              if [ -n "$exclusive_start_key" ]; then
                scan_args+=(--exclusive-start-key "$exclusive_start_key")
              fi

              response=$(aws "${scan_args[@]}")
              page_count=$(jq -r '.Count // 0' <<<"$response")
              active_count=$((active_count + page_count))
              exclusive_start_key=$(jq -c '.LastEvaluatedKey // empty' <<<"$response")

              if [ "$active_count" -gt 0 ] || [ -z "$exclusive_start_key" ]; then
                break
              fi
            done

            if [ "$active_count" = "0" ]; then
              echo "No active meeting leases found. Continuing deployment."
              break
            fi

            if [ "$now_epoch_seconds" -ge "$deadline" ]; then
              echo "ERROR: Found $active_count active meeting lease(s) after waiting $WAIT_TIMEOUT_SECONDS seconds. Not replacing the ECS task while recording may be active."
              exit 1
            fi

            echo "Found $active_count active meeting lease(s). Waiting $POLL_SECONDS seconds before deployment..."
            sleep "$POLL_SECONDS"
          done

      - name: Update ECS service with new task definition
        id: update-service
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          # Get the current task definition
          TASK_DEFINITION=$(aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --region $AWS_REGION)

          # Update the container image in the task definition
          NEW_TASK_DEFINITION=$(echo "$TASK_DEFINITION" | jq --arg IMAGE "$IMAGE" '.taskDefinition | .containerDefinitions[0].image = $IMAGE')

          # Clean up the task definition JSON to remove invalid fields
          CLEAN_TASK_DEFINITION=$(echo "$NEW_TASK_DEFINITION" | jq 'del(.status, .taskDefinitionArn, .revision, .registeredAt, .registeredBy, .compatibilities, .requiresAttributes)')

          # Register the new task definition revision
          echo "$CLEAN_TASK_DEFINITION" | jq 'del(.taskDefinitionArn, .status, .revision, .registeredAt, .registeredBy)' > new-task-def.json
          REGISTERED_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json)
          NEW_TASK_DEFINITION_ARN=$(echo "$REGISTERED_TASK_DEF" | jq -r '.taskDefinition.taskDefinitionArn')
          echo "new_task_def=$NEW_TASK_DEFINITION_ARN" >> $GITHUB_OUTPUT

          # Update the ECS service to use the new task definition revision
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_TASK_DEFINITION_ARN" --region $AWS_REGION

      - name: Wait for service stability
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          echo "Waiting for ECS service to stabilize..."

          if aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION"; then
            echo "Service has stabilized successfully!"
            exit 0
          fi

          echo "ERROR: Service failed to stabilize."
          SERVICE_STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region "$AWS_REGION")
          echo "Recent service events:"
          echo "$SERVICE_STATUS" | jq -r '.services[0].events[0:10][] | .message' || true
          exit 1

      - name: Verify deployment health
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "Verifying deployment health..."

          # A parked environment (ECS_DESIRED_COUNT=0) is supposed to have no
          # tasks, so zero is the expected result rather than a failed rollout.
          DESIRED_COUNT=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --region $AWS_REGION --query 'services[0].desiredCount' --output text)
          if [ "$DESIRED_COUNT" = "0" ]; then
            echo "Service is parked (desiredCount=0). Image and task definition are updated; skipping running-task health check."
            exit 0
          fi

          # Get the running tasks
          RUNNING_TASKS=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" --desired-status RUNNING --region $AWS_REGION | jq -r '.taskArns[]')

          if [ -z "$RUNNING_TASKS" ]; then
            echo "ERROR: No running tasks found!"
            exit 1
          fi

          # Check CloudWatch logs for startup errors (if available)
          LOG_GROUP="$ECS_LOG_GROUP"
          CURRENT_TIME=$(date +%s000)
          START_TIME=$((CURRENT_TIME - 300000)) # Last 5 minutes

          echo "Checking recent logs for errors..."
          RECENT_LOGS=$(aws logs filter-log-events --log-group-name $LOG_GROUP --start-time $START_TIME --filter-pattern "ERROR" --region $AWS_REGION 2>/dev/null || echo "{}")

          if [ $(echo "$RECENT_LOGS" | jq -r '.events | length') -gt 0 ]; then
            echo "WARNING: Found error logs in the last 5 minutes:"
            echo "$RECENT_LOGS" | jq -r '.events[] | .message' | head -10
          fi

          echo "Deployment completed successfully!"

      - name: Rollback on failure
        if: failure() && steps.update-service.outcome == 'success'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PREVIOUS_TASK_DEF: ${{ steps.current-task-def.outputs.current_task_def }}
        run: |
          echo "Deployment failed! Rolling back to previous task definition: $PREVIOUS_TASK_DEF"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition $PREVIOUS_TASK_DEF \
            --region $AWS_REGION

          echo "Rollback initiated. Previous deployment restored."

      - name: Create deployment summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$JOB_STATUS" == "success" ]; then
            echo "## ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch:** $REF_NAME" >> $GITHUB_STEP_SUMMARY
            echo "- **Deployed by:** $ACTOR" >> $GITHUB_STEP_SUMMARY
            echo "- **Deployment time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch:** $REF_NAME" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed by:** $ACTOR" >> $GITHUB_STEP_SUMMARY
            echo "- **Failure time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-frontend:
    name: Deploy Frontend
    needs: [ci]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Build frontend (Vite)
        run: yarn build:web

      - name: Sync frontend to S3 and invalidate CloudFront
        uses: ./.github/actions/sync-frontend
        with:
          bucket: ${{ vars.FRONTEND_BUCKET }}
          distribution-id: ${{ vars.FRONTEND_DISTRIBUTION_ID }}

  deploy-docs:
    name: Deploy Docs
    needs: [ci]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check docs deploy configuration
        id: docs-config
        env:
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
          DOCS_DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DOCS_BUCKET" ] || [ -z "$DOCS_DISTRIBUTION_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docs deployment skipped because DOCS_BUCKET or DOCS_DISTRIBUTION_ID is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.docs-config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        if: steps.docs-config.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        if: steps.docs-config.outputs.enabled == 'true'
        run: bash scripts/ci-install-dependencies.sh

      - name: Build docs site
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          DOCS_ALGOLIA_APP_ID: ${{ vars.DOCS_ALGOLIA_APP_ID }}
          DOCS_ALGOLIA_API_KEY: ${{ vars.DOCS_ALGOLIA_API_KEY }}
          DOCS_ALGOLIA_INDEX_NAME: ${{ vars.DOCS_ALGOLIA_INDEX_NAME }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: yarn docs:build

      - name: Verify docs build output
        if: steps.docs-config.outputs.enabled == 'true'
        run: test -d build/docs-site

      - name: Sync docs to S3
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
        run: |
          if [ -z "$DOCS_BUCKET" ]; then
            echo "DOCS_BUCKET not set in environment variables"
            exit 1
          fi

          aws s3 sync build/docs-site s3://$DOCS_BUCKET --delete --exclude "assets/*" --cache-control "public,max-age=600"

          if [ -d build/docs-site/assets ]; then
            aws s3 sync build/docs-site/assets s3://$DOCS_BUCKET/assets --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Invalidate docs CloudFront
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          DOCS_DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DOCS_DISTRIBUTION_ID" ]; then
            echo "DOCS_DISTRIBUTION_ID not set in environment variables"
            exit 1
          fi

          aws cloudfront create-invalidation --distribution-id "$DOCS_DISTRIBUTION_ID" --paths "/*"

  # Promotes prompts only after the backend that supplies their variables is
  # live. A prompt is safe to run against newer code (unused variables are
  # ignored) but not against older code, which is how a role-mention prompt
  # once shipped ahead of the code that filled its roster. Running here also
  # guarantees the push happens from the merged revision, so it cannot revert
  # a prompt someone else pushed from a stale checkout.
  promote-prompts:
    name: Promote Prompts
    needs: [deploybackend]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Show pending prompt changes
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          LANGFUSE_PROMPT_LABEL: ${{ vars.LANGFUSE_PROMPT_LABEL }}
        run: yarn prompts:push --dry-run

      - name: Promote prompts to Langfuse
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          LANGFUSE_PROMPT_LABEL: ${{ vars.LANGFUSE_PROMPT_LABEL }}
        run: yarn prompts:push

      - name: Verify repo and Langfuse agree
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          LANGFUSE_PROMPT_LABEL: ${{ vars.LANGFUSE_PROMPT_LABEL }}
        run: yarn prompts:check
