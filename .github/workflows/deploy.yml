name: Meeting Notes Bot Deploy

run-name: Meeting Notes Bot Deploy ${{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: chronote-deploy-production
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/master'
    name: CI
    uses: ./.github/workflows/ci-core.yml
    secrets: inherit

  deploybackend:
    name: Deploy Backend
    timeout-minutes: 180
    # Publish privacy/What's New notices before expanded capture goes live.
    needs: [ci, deploy-docs]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_ENVIRONMENT: production
      DEPLOYMENT_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DEPLOYMENT_CONTROL_TABLE: ${{ vars.DEPLOYMENT_CONTROL_TABLE }}
      DEPLOYMENT_GUARD_ROLE_ARN: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      DEPLOYMENT_LISTENER_ARN: ${{ vars.DEPLOYMENT_LISTENER_ARN }}
      DEPLOYMENT_TARGET_GROUP_A: ${{ vars.DEPLOYMENT_TARGET_GROUP_A }}
      DEPLOYMENT_TARGET_GROUP_B: ${{ vars.DEPLOYMENT_TARGET_GROUP_B }}
      ECS_LOG_GROUP: ${{ vars.ECS_LOG_GROUP }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      SECRETS_PREFIX: ${{ vars.SECRETS_PREFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup coordinator Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install coordinator dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Build backend protocol builders
        run: yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: chronote-production-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 10800
          unset-current-credentials: true
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify exact production role session
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_ROLE_ARN: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
          EXPECTED_SESSION_NAME: chronote-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json 2>/dev/null | node scripts/deployment/assert-production-identity.cjs

      - name: Refuse held production deployment
        id: hold-guard
        run: node scripts/deployment/production-writer-guard.cjs

      - name: Preflight Secrets Manager values
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          SECRETS_PREFIX="${SECRETS_PREFIX:-}"
          if [ -z "$SECRETS_PREFIX" ] && [ -n "${ECS_TASK_FAMILY:-}" ]; then
            SECRETS_PREFIX="${ECS_TASK_FAMILY%-bot-task}"
          fi
          if [ -z "$SECRETS_PREFIX" ]; then
            echo "ERROR: SECRETS_PREFIX is not set and could not be derived."
            exit 1
          fi

          SECRETS=(
            "${SECRETS_PREFIX}/discord-bot-token"
            "${SECRETS_PREFIX}/discord-client-secret"
            "${SECRETS_PREFIX}/oauth-secret"
            "${SECRETS_PREFIX}/openai-api-key"
            "${SECRETS_PREFIX}/langfuse-public-key"
            "${SECRETS_PREFIX}/langfuse-secret-key"
            "${SECRETS_PREFIX}/stripe-secret-key"
            "${SECRETS_PREFIX}/stripe-webhook-secret"
          )

          missing=()
          for secret in "${SECRETS[@]}"; do
            if ! versions=$(aws secretsmanager list-secret-version-ids --secret-id "$secret" --region "$AWS_REGION" 2>/dev/null); then
              missing+=("$secret (missing)")
              continue
            fi
            if ! echo "$versions" | jq -e '.Versions[]? | select(.VersionStages | index("AWSCURRENT"))' >/dev/null; then
              missing+=("$secret (no AWSCURRENT value)")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing or unset Secrets Manager values:"
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

          echo "Secrets Manager preflight passed."

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image tag already exists, skipping build and push."
            echo "image=$IMAGE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t "$IMAGE" .

          # Verify the image contains the required files
          echo "Verifying Docker image contents..."
          docker run --rm "$IMAGE" ls -la dist/index.js || {
            echo "ERROR: dist/index.js not found in Docker image!"
            exit 1
          }

          node scripts/deployment/production-writer-guard.cjs
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Pin candidate image and deployment identity
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${IMAGE##*:}" --query 'imageDetails[0].imageDigest' --output text)
          echo "CANDIDATE_IMAGE=${IMAGE%:*}@$digest" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_RUN_TOKEN=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_CANDIDATE_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Protect serving runtime and warm candidate
        id: prepare
        run: node scripts/deployment/coordinator.cjs prepare

      - name: Promote exact ready candidate
        id: promote
        run: node scripts/deployment/coordinator.cjs promote

      - name: Wait for runtime-owned retirement acknowledgment
        id: retire
        run: node scripts/deployment/coordinator.cjs retire

      - name: Reconcile failed deployment without terminating work
        if: failure() && steps.hold-guard.outcome == 'success' && steps.prepare.outcome == 'success'
        run: node scripts/deployment/coordinator.cjs reconcile

      - name: Create deployment summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$JOB_STATUS" == "success" ]; then
            echo "## ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch:** $REF_NAME" >> $GITHUB_STEP_SUMMARY
            echo "- **Deployed by:** $ACTOR" >> $GITHUB_STEP_SUMMARY
            echo "- **Deployment time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch:** $REF_NAME" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed by:** $ACTOR" >> $GITHUB_STEP_SUMMARY
            echo "- **Failure time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-frontend:
    name: Deploy Frontend
    needs: [ci, deploy-docs, deploybackend]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Build frontend (Vite)
        run: yarn build:web

      - name: Build hold schema
        run: yarn build

      - name: Mask site publisher identity
        id: publisher-identity
        env:
          TERRAFORM_PRIVATE_STORAGE_JSON: ${{ secrets.TERRAFORM_PRIVATE_STORAGE_JSON }}
        run: node scripts/deployment/site-publisher-identity.cjs identity

      - name: Validate site publisher bindings
        env:
          IDENTITY_MATCHES: ${{ vars.AWS_ACCOUNT_ID == steps.publisher-identity.outputs.account_id && vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN == steps.publisher-identity.outputs.role_arn && vars.DEPLOYMENT_CONTROL_TABLE == steps.publisher-identity.outputs.control_table }}
        run: test "$IDENTITY_MATCHES" = true

      - name: Prepare site publisher session
        env:
          TERRAFORM_PRIVATE_STORAGE_JSON: ${{ secrets.TERRAFORM_PRIVATE_STORAGE_JSON }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          PRODUCTION_BACKEND_DEPLOY_ROLE_ARN: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
          DEPLOYMENT_CONTROL_TABLE: ${{ vars.DEPLOYMENT_CONTROL_TABLE }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          FRONTEND_DISTRIBUTION_ID: ${{ vars.FRONTEND_DISTRIBUTION_ID }}
        run: node scripts/deployment/site-publisher-identity.cjs session frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: chronote-production-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload"],"Resource":["arn:aws:s3:::${{ vars.FRONTEND_BUCKET }}","arn:aws:s3:::${{ vars.FRONTEND_BUCKET }}/*"]},{"Effect":"Allow","Action":["cloudfront:CreateInvalidation"],"Resource":"arn:aws:cloudfront::${{ vars.AWS_ACCOUNT_ID }}:distribution/${{ vars.FRONTEND_DISTRIBUTION_ID }}"},{"Effect":"Allow","Action":["dynamodb:GetItem"],"Resource":"arn:aws:dynamodb:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:table/${{ vars.DEPLOYMENT_CONTROL_TABLE }}","Condition":{"ForAllValues:StringEquals":{"dynamodb:LeadingKeys":["ENV"]}}},{"Effect":"Allow","Action":["kms:GenerateDataKey","kms:Decrypt"],"Resource":"arn:aws:kms:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:key/*","Condition":{"StringEquals":{"kms:CallerAccount":"${{ vars.AWS_ACCOUNT_ID }}","kms:ViaService":"s3.${{ vars.AWS_REGION }}.amazonaws.com"},"StringLike":{"kms:EncryptionContext:aws:s3:arn":"arn:aws:s3:::${{ vars.FRONTEND_BUCKET }}/*"}}},{"Effect":"Allow","Action":["kms:Decrypt"],"Resource":"arn:aws:kms:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:key/*","Condition":{"StringEquals":{"kms:CallerAccount":"${{ vars.AWS_ACCOUNT_ID }}","kms:ViaService":"dynamodb.${{ vars.AWS_REGION }}.amazonaws.com","kms:EncryptionContext:aws:dynamodb:subscriberId":"${{ vars.AWS_ACCOUNT_ID }}","kms:EncryptionContext:aws:dynamodb:tableName":"${{ vars.DEPLOYMENT_CONTROL_TABLE }}"}}}]}'

      - name: Verify exact site publisher identity
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_ROLE_ARN: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
          EXPECTED_SESSION_NAME: chronote-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json 2>/dev/null | node scripts/deployment/assert-production-identity.cjs

      - name: Check production hold before frontend publication
        env:
          DEPLOYMENT_ENVIRONMENT: production
          DEPLOYMENT_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOYMENT_CONTROL_TABLE: ${{ vars.DEPLOYMENT_CONTROL_TABLE }}
          DEPLOYMENT_GUARD_ROLE_ARN: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
        run: node scripts/deployment/production-writer-guard.cjs

      - name: Sync frontend to S3 and invalidate CloudFront
        uses: ./.github/actions/sync-frontend
        with:
          bucket: ${{ vars.FRONTEND_BUCKET }}
          distribution-id: ${{ vars.FRONTEND_DISTRIBUTION_ID }}

  deploy-docs:
    name: Deploy Docs
    needs: [ci]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check docs deploy configuration
        id: docs-config
        env:
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
          DOCS_DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DOCS_BUCKET" ] || [ -z "$DOCS_DISTRIBUTION_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docs deployment is required before the product deploy, including privacy notices." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.docs-config.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        if: steps.docs-config.outputs.enabled == 'true'
        run: bash scripts/ci-install-dependencies.sh

      - name: Build docs site
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          DOCS_ALGOLIA_APP_ID: ${{ vars.DOCS_ALGOLIA_APP_ID }}
          DOCS_ALGOLIA_API_KEY: ${{ vars.DOCS_ALGOLIA_API_KEY }}
          DOCS_ALGOLIA_INDEX_NAME: ${{ vars.DOCS_ALGOLIA_INDEX_NAME }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: yarn docs:build

      - name: Verify docs build output
        if: steps.docs-config.outputs.enabled == 'true'
        run: test -d build/docs-site

      - name: Build hold schema
        if: steps.docs-config.outputs.enabled == 'true'
        run: yarn build

      - name: Mask site publisher identity
        id: publisher-identity
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          TERRAFORM_PRIVATE_STORAGE_JSON: ${{ secrets.TERRAFORM_PRIVATE_STORAGE_JSON }}
        run: node scripts/deployment/site-publisher-identity.cjs identity

      - name: Validate site publisher bindings
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          IDENTITY_MATCHES: ${{ vars.AWS_ACCOUNT_ID == steps.publisher-identity.outputs.account_id && vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN == steps.publisher-identity.outputs.role_arn && vars.DEPLOYMENT_CONTROL_TABLE == steps.publisher-identity.outputs.control_table }}
        run: test "$IDENTITY_MATCHES" = true

      - name: Prepare site publisher session
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          TERRAFORM_PRIVATE_STORAGE_JSON: ${{ secrets.TERRAFORM_PRIVATE_STORAGE_JSON }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          PRODUCTION_BACKEND_DEPLOY_ROLE_ARN: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
          DEPLOYMENT_CONTROL_TABLE: ${{ vars.DEPLOYMENT_CONTROL_TABLE }}
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
          DOCS_DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: node scripts/deployment/site-publisher-identity.cjs session docs

      - name: Configure AWS credentials
        if: steps.docs-config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: chronote-production-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          mask-aws-account-id: true
          aws-region: ${{ vars.AWS_REGION }}
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload"],"Resource":["arn:aws:s3:::${{ vars.DOCS_BUCKET }}","arn:aws:s3:::${{ vars.DOCS_BUCKET }}/*"]},{"Effect":"Allow","Action":["cloudfront:CreateInvalidation","cloudfront:GetDistribution","cloudfront:GetInvalidation"],"Resource":"arn:aws:cloudfront::${{ vars.AWS_ACCOUNT_ID }}:distribution/${{ vars.DOCS_DISTRIBUTION_ID }}"},{"Effect":"Allow","Action":["dynamodb:GetItem"],"Resource":"arn:aws:dynamodb:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:table/${{ vars.DEPLOYMENT_CONTROL_TABLE }}","Condition":{"ForAllValues:StringEquals":{"dynamodb:LeadingKeys":["ENV"]}}},{"Effect":"Allow","Action":["kms:GenerateDataKey","kms:Decrypt"],"Resource":"arn:aws:kms:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:key/*","Condition":{"StringEquals":{"kms:CallerAccount":"${{ vars.AWS_ACCOUNT_ID }}","kms:ViaService":"s3.${{ vars.AWS_REGION }}.amazonaws.com"},"StringLike":{"kms:EncryptionContext:aws:s3:arn":"arn:aws:s3:::${{ vars.DOCS_BUCKET }}/*"}}},{"Effect":"Allow","Action":["kms:Decrypt"],"Resource":"arn:aws:kms:${{ vars.AWS_REGION }}:${{ vars.AWS_ACCOUNT_ID }}:key/*","Condition":{"StringEquals":{"kms:CallerAccount":"${{ vars.AWS_ACCOUNT_ID }}","kms:ViaService":"dynamodb.${{ vars.AWS_REGION }}.amazonaws.com","kms:EncryptionContext:aws:dynamodb:subscriberId":"${{ vars.AWS_ACCOUNT_ID }}","kms:EncryptionContext:aws:dynamodb:tableName":"${{ vars.DEPLOYMENT_CONTROL_TABLE }}"}}}]}'

      - name: Verify exact site publisher identity
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_ROLE_ARN: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
          EXPECTED_SESSION_NAME: chronote-production-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json 2>/dev/null | node scripts/deployment/assert-production-identity.cjs

      - name: Preflight docs publish targets
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
          DOCS_DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          if [ -z "$DOCS_BUCKET" ]; then
            echo "ERROR: DOCS_BUCKET is not set in the GitHub Actions environment."
            exit 1
          fi

          if [ -z "$DOCS_DISTRIBUTION_ID" ]; then
            echo "ERROR: DOCS_DISTRIBUTION_ID is not set in the GitHub Actions environment."
            exit 1
          fi

          if ! aws s3api head-bucket --bucket "$DOCS_BUCKET" >/dev/null 2>&1; then
            echo "ERROR: Docs bucket is not accessible with the configured AWS credentials."
            exit 1
          fi

          if ! aws cloudfront get-distribution --id "$DOCS_DISTRIBUTION_ID" >/dev/null 2>&1; then
            echo "ERROR: Docs distribution is not accessible with the configured AWS credentials."
            exit 1
          fi

      - name: Sync docs to S3
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          DEPLOYMENT_ENVIRONMENT: production
          DEPLOYMENT_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOYMENT_CONTROL_TABLE: ${{ vars.DEPLOYMENT_CONTROL_TABLE }}
          DEPLOYMENT_GUARD_ROLE_ARN: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$DOCS_BUCKET" ]; then
            echo "DOCS_BUCKET not set in environment variables"
            exit 1
          fi

          node scripts/deployment/production-writer-guard.cjs
          aws s3 sync build/docs-site s3://$DOCS_BUCKET --delete --exclude "assets/*" --cache-control "public,max-age=600"

          if [ -d build/docs-site/assets ]; then
            node scripts/deployment/production-writer-guard.cjs
            aws s3 sync build/docs-site/assets s3://$DOCS_BUCKET/assets --delete --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Invalidate docs CloudFront
        if: steps.docs-config.outputs.enabled == 'true'
        env:
          DEPLOYMENT_ENVIRONMENT: production
          DEPLOYMENT_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOYMENT_CONTROL_TABLE: ${{ vars.DEPLOYMENT_CONTROL_TABLE }}
          DEPLOYMENT_GUARD_ROLE_ARN: ${{ vars.PRODUCTION_BACKEND_DEPLOY_ROLE_ARN }}
          DOCS_DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DOCS_DISTRIBUTION_ID" ]; then
            echo "DOCS_DISTRIBUTION_ID not set in environment variables"
            exit 1
          fi

          node scripts/deployment/production-writer-guard.cjs
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "$DOCS_DISTRIBUTION_ID" --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DOCS_DISTRIBUTION_ID" --id "$INVALIDATION_ID"

  # Promotes prompts only after the backend that supplies their variables is
  # live. A prompt is safe to run against newer code (unused variables are
  # ignored) but not against older code, which is how a role-mention prompt
  # once shipped ahead of the code that filled its roster. Running here also
  # guarantees the push happens from the merged revision, so it cannot revert
  # a prompt someone else pushed from a stale checkout.
  promote-prompts:
    name: Promote Prompts
    needs: [deploybackend]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_ENVIRONMENT: production
      DEPLOYMENT_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DEPLOYMENT_CONTROL_TABLE: ${{ vars.DEPLOYMENT_CONTROL_TABLE }}
      DEPLOYMENT_GUARD_ROLE_ARN: ${{ vars.PRODUCTION_PROMPT_GUARD_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Build hold schema
        run: yarn build

      - name: Configure read-only production hold identity
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PRODUCTION_PROMPT_GUARD_ROLE_ARN }}
          role-session-name: prompt-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check production hold
        run: node scripts/deployment/production-writer-guard.cjs

      - name: Show pending prompt changes
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          LANGFUSE_PROMPT_LABEL: ${{ vars.LANGFUSE_PROMPT_LABEL }}
        run: yarn prompts:push --dry-run

      - name: Promote prompts to Langfuse
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          LANGFUSE_PROMPT_LABEL: ${{ vars.LANGFUSE_PROMPT_LABEL }}
        run: |
          node scripts/deployment/production-writer-guard.cjs
          yarn prompts:push

      - name: Verify repo and Langfuse agree
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          LANGFUSE_PROMPT_LABEL: ${{ vars.LANGFUSE_PROMPT_LABEL }}
        run: yarn prompts:check

  # Only production may update the shared Langfuse OpenAI connection.
  sync-openai-connection:
    name: Sync OpenAI LLM Connection
    needs: [deploybackend]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_ENVIRONMENT: production
      DEPLOYMENT_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      DEPLOYMENT_CONTROL_TABLE: ${{ vars.DEPLOYMENT_CONTROL_TABLE }}
      DEPLOYMENT_GUARD_ROLE_ARN: ${{ vars.PRODUCTION_PROMPT_GUARD_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Build hold schema
        run: yarn build

      - name: Configure reviewed connection-sync identity
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PRODUCTION_PROMPT_GUARD_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: prompt-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify exact connection-sync role session
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_ROLE_ARN: ${{ vars.PRODUCTION_PROMPT_GUARD_ROLE_ARN }}
          EXPECTED_SESSION_NAME: prompt-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity --output json 2>/dev/null | node scripts/deployment/assert-production-identity.cjs

      - name: Sync serving OpenAI connection
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
          SECRETS_PREFIX: ${{ vars.SECRETS_PREFIX }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${ECS_CLUSTER:-}" ] || [ -z "${ECS_SERVICE:-}" ]; then
            echo "ERROR: ECS_CLUSTER and ECS_SERVICE are required for the serving OpenAI connection."
            exit 1
          fi
          SECRETS_PREFIX="${SECRETS_PREFIX:-}"
          if [ -z "$SECRETS_PREFIX" ] && [ -n "${ECS_TASK_FAMILY:-}" ]; then
            SECRETS_PREFIX="${ECS_TASK_FAMILY%-bot-task}"
          fi
          if [ -z "$SECRETS_PREFIX" ]; then
            echo "ERROR: SECRETS_PREFIX is not set and could not be derived."
            exit 1
          fi

          # Read the service pointer, never the latest task-family revision.
          if ! task_definition_arn=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[?status=='ACTIVE'].taskDefinition | [0]" --output text 2>/dev/null) \
            || [ -z "$task_definition_arn" ] || [ "$task_definition_arn" = "None" ]; then
            echo "ERROR: Could not resolve the serving ECS service task definition."
            exit 1
          fi
          expected_definition="arn:aws:ecs:${AWS_REGION}:${DEPLOYMENT_ACCOUNT_ID}:task-definition/${ECS_TASK_FAMILY}:"
          revision="${task_definition_arn#"$expected_definition"}"
          if [ "$revision" = "$task_definition_arn" ] || ! [[ "$revision" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: Serving task definition is outside the reviewed account, region or family."
            exit 1
          fi
          export SERVING_TASK_DEFINITION_ARN="$task_definition_arn"
          # Match the app container exactly as the deployment coordinator does.
          if ! OPENAI_PROJECT_ID=$(aws ecs describe-task-definition \
            --task-definition "$task_definition_arn" --output json 2>/dev/null | node -e '
              const { readFileSync } = require("node:fs");
              const { taskDefinition } = JSON.parse(readFileSync(0, "utf8"));
              if (taskDefinition.taskDefinitionArn !== process.env.SERVING_TASK_DEFINITION_ARN
                || taskDefinition.family !== process.env.ECS_TASK_FAMILY) process.exit(1);
              const apps = taskDefinition.containerDefinitions.filter((container) =>
                container.environment?.some((entry) => entry.name === "DDB_TABLE_PREFIX"),
              );
              if (apps.length !== 1) process.exit(1);
              const projects = apps[0].environment.filter(
                (entry) => entry.name === "OPENAI_PROJECT_ID",
              );
              if (projects.length !== 1 || typeof projects[0].value !== "string"
                || !projects[0].value.trim()) process.exit(1);
              process.stdout.write(projects[0].value);
            ' 2>/dev/null); then
            echo "ERROR: Serving task definition must have one app container with a nonempty OPENAI_PROJECT_ID."
            exit 1
          fi
          echo "::add-mask::$OPENAI_PROJECT_ID"
          node scripts/deployment/production-writer-guard.cjs
          if ! OPENAI_API_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "${SECRETS_PREFIX}/openai-api-key" --version-stage AWSCURRENT \
            --query SecretString --output text 2>/dev/null) \
            || [ -z "${OPENAI_API_KEY//[[:space:]]/}" ] || [ "$OPENAI_API_KEY" = "None" ]; then
            echo "ERROR: Could not retrieve a nonempty OPENAI_API_KEY from Secrets Manager."
            exit 1
          fi
          echo "::add-mask::$OPENAI_API_KEY"
          export OPENAI_API_KEY OPENAI_PROJECT_ID

          connections_dir=$(mktemp -d)
          trap 'rm -rf "$connections_dir"' EXIT
          cp langfuse/llm-connections/openai.yml "$connections_dir/openai.yml"
          yarn llm-connections:push --dir "$connections_dir" --dry-run
          node scripts/deployment/production-writer-guard.cjs
          yarn llm-connections:push --dir "$connections_dir"
          yarn llm-connections:check --dir "$connections_dir"
